name: Frontend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
      - name: Install node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"
      - name: Install Dependencies
        run: npm ci

      - name: Type checking
        run: npm run typecheck

      - name: Run tests
        run: npm run test:run
      - name: Build Project
        run: npm run build
